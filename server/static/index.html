<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>Exporter USB</title>
<style>
  /* Same look as music-sync. Fonts are bundled (static/fonts): Arimo = Arial metrics, Cousine = monospace. */
  @font-face { font-family: Arimo; font-weight: 400; font-display: swap; src: url(/static/fonts/arimo-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Arimo; font-weight: 400; font-display: swap; src: url(/static/fonts/arimo-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: Arimo; font-weight: 400; font-display: swap; src: url(/static/fonts/arimo-cyrillic-400-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Arimo; font-weight: 400; font-display: swap; src: url(/static/fonts/arimo-greek-400-normal.woff2) format("woff2"); unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
  @font-face { font-family: Arimo; font-weight: 700; font-display: swap; src: url(/static/fonts/arimo-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Arimo; font-weight: 700; font-display: swap; src: url(/static/fonts/arimo-latin-ext-700-normal.woff2) format("woff2"); unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: Arimo; font-weight: 700; font-display: swap; src: url(/static/fonts/arimo-cyrillic-700-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Arimo; font-weight: 700; font-display: swap; src: url(/static/fonts/arimo-greek-700-normal.woff2) format("woff2"); unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
  @font-face { font-family: Cousine; font-display: swap; src: url(/static/fonts/cousine-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Cousine; font-display: swap; src: url(/static/fonts/cousine-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: Cousine; font-display: swap; src: url(/static/fonts/cousine-cyrillic-400-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Cousine; font-display: swap; src: url(/static/fonts/cousine-greek-400-normal.woff2) format("woff2"); unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }

  /* Display font: served from /etc/usb-exporter/fonts in the container (commercial, not in the repo).
     Metrics as in music-sync so capitals sit centred in their line box. */
  @font-face { font-family: "TAN Spring"; font-display: swap; src: url(/fonts/TAN-SPRING.otf) format("opentype");
               ascent-override: 87.5%; descent-override: 12.5%; line-gap-override: 0%; }

  :root {
    --ink: #0B0B0B; --panel: #121211; --line: #E8E8E2; --dim: #8C8C86; --faint: #5A5A55;
    --edge: #3A3A36; --hair: #2A2A28; --lime: #C8F53C; --orange: #E8A33A; --red: #FF2B1C;
    --sans: Arimo, Arial, "Liberation Sans", sans-serif; --mono: Cousine, Consolas, "DejaVu Sans Mono", monospace;
    --display: "TAN Spring", Arimo, Arial, sans-serif;
    --gut: 20px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--ink); color: var(--line); font: 14px/1.4 var(--sans); }
  a { color: inherit; }
  h1 { margin: 0; font: normal 26px var(--display); color: var(--lime); letter-spacing: .5px; white-space: nowrap; }
  .section { color: var(--dim); font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
  .muted { color: var(--dim); font-size: 12px; }
  .ok { color: var(--lime); } .miss { color: var(--orange); } .faint { color: var(--faint); } .err { color: var(--red); }
  .path { font: 12px var(--mono); color: var(--dim); word-break: break-all; }

  /* header */
  header.top { position: sticky; top: 0; z-index: 5; background: var(--ink); display: flex; align-items: center; gap: 18px;
               padding: 12px var(--gut) 10px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  nav { display: flex; gap: 20px; }
  nav a { color: var(--dim); text-decoration: none; font-size: 11px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase;
          padding: 6px 0 4px; border-bottom: 2px solid transparent; }
  nav a:hover { color: var(--line); }
  nav a.on { color: var(--lime); border-bottom-color: var(--lime); }
  .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
  .bar { height: 3px; background: transparent; }
  .bar > div { height: 100%; width: 0; background: var(--lime); transition: width .2s; }
  .jobline { padding: 6px var(--gut); font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--hair); display: none; }
  .jobline.show { display: block; }

  /* stat strip */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 10px; padding: 14px var(--gut) 0; }
  .tile { border: 1px solid var(--hair); padding: 10px 12px; text-decoration: none; display: block; min-width: 0; }
  a.tile:hover { background: var(--panel); }
  .tile .n { font-size: 24px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { height: 4px; background: var(--panel); margin-top: 6px; }
  .meter > div { height: 100%; background: var(--lime); }

  main { padding: 14px var(--gut) 40px; }

  .pane { border: 1px solid var(--hair); min-width: 0; }
  .pane-head { padding: 12px; border-bottom: 1px solid var(--hair); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pane-foot { padding: 12px; border-top: 1px solid var(--hair); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .scroll { max-height: calc(100vh - 330px); overflow: auto; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--dim); font-size: 11px; letter-spacing: 1px; padding: 8px; border-bottom: 1px solid var(--hair); white-space: nowrap; position: sticky; top: 0; background: var(--ink); }
  td { padding: 7px 8px; border-bottom: 1px solid #161615; vertical-align: top; }
  td.num, th.num { text-align: right; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--panel); }
  tr.in-sync td:nth-child(4) { color: var(--lime); } tr.differs td:nth-child(4) { color: var(--orange); }
  tr.only td { color: var(--faint); }
  .more { color: var(--faint); cursor: pointer; font-size: 12px; margin-left: 6px; text-decoration: underline; }
  .more:hover { color: var(--line); }
  tr.details td { background: var(--panel); font-size: 12px; color: var(--dim); padding: 6px 8px 10px 44px; }
  tr.details b { color: var(--line); font-weight: normal; display: block; margin-top: 4px; }
  .warn { color: var(--orange); font-size: 12px; }

  /* controls */
  button, a.btn { background: var(--ink); color: var(--dim); border: 1px solid var(--edge); padding: 7px 14px; text-decoration: none; display: inline-block;
           font: bold 11px var(--sans); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled), a.btn:hover { color: var(--line); border-color: var(--line); }
  button:active:not(:disabled) { background: var(--lime); color: var(--ink); border-color: var(--lime); }
  button:disabled { color: var(--faint); border-color: var(--hair); cursor: default; }
  button.accent { color: var(--lime); border-color: var(--lime); font: normal 14px/1 var(--display); letter-spacing: .5px; text-transform: none;
                  padding: 9px 16px; display: inline-flex; align-items: center; justify-content: center; }
  button.accent:hover:not(:disabled) { background: var(--lime); color: var(--ink); }
  button.danger { color: var(--red); border-color: #5a1f1a; }
  button.danger:hover:not(:disabled) { color: var(--ink); background: var(--red); border-color: var(--red); }
  .chip { padding: 4px 10px; }
  .chip.on { color: var(--lime); border-color: var(--lime); }
  input[type=search], input[type=text], select { background: var(--panel); color: var(--line); border: 1px solid var(--edge); padding: 7px 9px; font: 13px var(--sans); border-radius: 0; }
  input[type=search] { flex: 1; min-width: 140px; }
  select, input[type=text] { width: 100%; margin: 4px 0 12px; }
  input[type=checkbox] { accent-color: var(--lime); width: 15px; height: 15px; vertical-align: middle; }
  label.opt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .for { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; width: 100%; }
  .for select, .for input[type=text] { width: auto; margin: 0; padding: 4px 6px; }
  
  .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .box { border: 1px solid var(--hair); padding: 14px; }
  .box .big-line { font: normal 22px var(--display); margin: 8px 0 4px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-top: 8px; }
  .kv span:nth-child(odd) { color: var(--dim); }
  pre { background: var(--panel); color: var(--dim); border: 1px solid var(--hair); padding: 8px 10px; height: 260px; overflow: auto; margin: 0;
        font: 12px var(--mono); white-space: pre-wrap; }
  .empty { padding: 30px 16px; color: var(--dim); text-align: center; }
  /* in-page dialogs (browsers can silently block confirm/alert/prompt) */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal .dlg { background: var(--ink); border: 1px solid var(--edge); max-width: 460px; width: 100%; padding: 18px; }
  .modal .dlg h3 { margin: 0 0 10px; font: normal 20px var(--display); color: var(--lime); }
  .modal .dlg.danger h3 { color: var(--red); }
  .modal .dlg p { margin: 0 0 12px; white-space: pre-line; color: var(--line); font-size: 13px; }
  .modal .dlg .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }

  @media (max-width: 860px) {
    :root { --gut: 14px; }
    header.top { gap: 10px; padding-top: 10px; }
    h1 { font-size: 22px; }
    .brand .section { display: none; }
    nav { order: 3; width: 100%; justify-content: space-between; border-top: 1px solid var(--hair); padding-top: 4px; }
    nav a { flex: 1; text-align: center; padding: 8px 0 6px; }
    .stats { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 42%; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 2px; }
    .tile { scroll-snap-align: start; }
    .scroll { max-height: none; }
    .hide-sm { display: none; }
    th { position: static; }
    td { padding: 8px 6px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>NAS &harr; USB</h1><span class="section">Exporter USB</span></div>
  <nav id="nav">
    <a href="#playlists">Playlists</a>
    <a href="#drive">Drive</a>
    <a href="#system">System</a>
  </nav>
  <div class="hdr-right">
    <span id="drivedot" class="dot"></span>
    <button id="export" class="accent">Export</button>
  </div>
</header>
<div class="bar"><div id="bar"></div></div>
<div id="jobline" class="jobline"></div>
<section class="stats" id="stats"></section>
<main id="view"><p class="muted">Loading&hellip;</p></main>

<script>
const $ = id => document.getElementById(id);
let data = null, selected = new Set(), preselected = false, wasMounted = false, open = new Set();
let filter = 'all', search = '', estimate = null, estTimer = null, polling = false, notice = null;
// layout to export in: the drive's own unless changed here
let chosenLayout = null;
const LAYOUT_NAMES = {mixxx: 'Mixxx', traktor: 'Traktor'};
function layoutNow() { return chosenLayout || (data && data.drive.layout) || 'mixxx'; }
function showLayout() {
  document.querySelectorAll('input[name=layout]').forEach(r => r.checked = r.value === layoutNow());
  if (!$('laynote')) return;
  const cur = data && data.drive.layout;
  $('laynote').textContent = cur && cur !== layoutNow()
    ? `The drive is in the ${LAYOUT_NAMES[cur]} layout: exporting rearranges its files (moved, nothing downloaded again).` : '';
}


function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function gb(n) { return n >= 2 ** 30 ? (n / 2 ** 30).toFixed(1) + ' GB' : Math.round(n / 2 ** 20) + ' MB'; }
function ago(iso) {
  if (!iso) return 'never';
  const s = (Date.now() - new Date(iso)) / 1000;
  return s < 90 ? 'just now' : s < 5400 ? Math.round(s / 60) + ' min ago' : s < 129600 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' days ago';
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  // behind the proxy an expired login answers with the login page (HTML), not with data
  if (!(r.headers.get('Content-Type') || '').includes('json') || r.redirected)
    throw new Error('Unexpected reply from the server - reload the page (login expired?)');
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
// dlg(title, text, {ok, cancel, danger, input}) -> Promise: true/false, or the typed text (null = cancelled)
function dlg(title, text, o = {}) {
  return new Promise(resolve => {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="dlg${o.danger ? ' danger' : ''}"><h3>${esc(title)}</h3><p>${esc(text)}</p>` +
      (o.input !== undefined ? `<input type="text" id="dlgin" placeholder="${esc(o.input)}">` : '') +
      `<div class="row">${o.cancel === false ? '' : `<button id="dlgno">${esc(o.cancel || 'Cancel')}</button>`}` +
      `<button id="dlgok" class="${o.danger ? 'danger' : 'accent'}">${esc(o.ok || 'OK')}</button></div></div>`;
    document.body.appendChild(m);
    const done = v => { m.remove(); resolve(v); };
    const ok = () => done(o.input !== undefined ? m.querySelector('#dlgin').value : true);
    m.querySelector('#dlgok').onclick = ok;
    if (m.querySelector('#dlgno')) m.querySelector('#dlgno').onclick = () => done(o.input !== undefined ? null : false);
    m.onclick = e => { if (e.target === m) done(o.input !== undefined ? null : false); };
    const inp = m.querySelector('#dlgin');
    if (inp) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') done(null); }; }
    else m.querySelector('#dlgok').focus();
  });
}
const tell = (title, text) => dlg(title, text, {cancel: false});
const mounted = () => data && data.drive.state === 'mounted';
const driveName = d => d.state === 'mounted' ? (d.label || 'USB drive')
  : ({ejected: 'Safe to remove', error: 'Drive not readable', formatting: 'Formatting…'}[d.state] || 'No drive');

// ------------------------------------------------------ header + stats --
function renderChrome() {
  const d = data.drive, j = data.job;
  $('drivedot').style.background = mounted() ? 'var(--lime)' : d.state === 'ejected' ? 'var(--line)' : 'var(--orange)';
  $('drivedot').title = driveName(d);
  $('export').disabled = j.running || !mounted() || !selected.size;
  $('export').textContent = j.running ? `Exporting ${j.done} / ${j.total}` : 'Export';
  $('bar').style.width = j.running && j.total ? (100 * j.done / j.total) + '%' : '0';
  const jl = $('jobline');
  jl.classList.toggle('show', !!(j.running || j.error || notice));
  jl.innerHTML = j.running ? (j.total ? `Exporting to ${esc(d.label || 'the drive')}: ${j.done} of ${j.total} files &middot; ${esc(j.log[j.log.length - 1] || '')}`
                                      : `Exporting to ${esc(d.label || 'the drive')}: checking what's already there&hellip;`)
               : j.error ? `<span class="err">Export failed: ${esc(j.error)}</span>` : notice ? `<span class="ok">${esc(notice)}</span>` : '';

  const pl = data.playlists, sync = pl.filter(p => p.state === 'in sync').length;
  const used = d.total ? d.total - d.free : 0;
  const tile = (label, n, sub, href, meter) => `<a class="tile" href="${href}"><div class="section">${label}</div><div class="n">${n}</div>` +
    (meter !== undefined ? `<div class="meter"><div style="width:${meter}%"></div></div>` : '') + `<div class="muted">${sub}</div></a>`;
  const sel = pl.filter(p => selected.has(p.name));
  $('stats').innerHTML =
    tile('Drive', esc(driveName(d)), mounted() ? `${gb(d.free)} free of ${gb(d.total)}${d.layout ? ' &middot; ' + LAYOUT_NAMES[d.layout] : ''}` : 'Front USB port', '#drive', mounted() ? Math.round(100 * used / d.total) : undefined) +
    tile('In sync', mounted() ? `${sync} / ${pl.length}` : '–', mounted() ? 'playlists on the drive' : 'no drive', '#playlists', mounted() && pl.length ? Math.round(100 * sync / pl.length) : undefined) +
    tile('Selected', `${sel.length}`, `${sel.reduce((a, p) => a + p.songs, 0)} songs` + (estimate !== null && mounted() ? ` &middot; <span class="${estimate > d.free ? 'err' : ''}">${estimate ? gb(estimate) + ' to copy' : 'nothing new'}</span>` : ''), '#playlists') +
    tile('Last export', data.last_export ? ago(data.last_export.at) : 'never', data.last_export ? `<span class="${data.last_export.ok ? '' : 'err'}">${esc(data.last_export.summary)}</span>` : 'this session', '#system');
}

// ------------------------------------------------------------- views ----
function viewPlaylists() {
  const pl = data.playlists.filter(p =>
    (filter === 'all' || (filter === 'differs' ? p.state === 'differs' : filter === 'missing' ? p.state === 'not on drive' : p.missing_count)) &&
    p.name.toLowerCase().includes(search.toLowerCase()));
  const chip = (id, label) => `<button class="chip${filter === id ? ' on' : ''}" data-filter="${id}">${label}</button>`;
  const rows = pl.map(p => {
    const cls = p.state === 'in sync' ? 'in-sync' : p.state === 'differs' ? 'differs' : '';
    const hasMore = p.missing_count || (p.state === 'differs' && (p.to_add.length || p.only_drive.length));
    const more = hasMore ? `<span class="more" data-more="${esc(p.name)}">${open.has(p.name) ? 'hide' : 'songs'}</span>` : '';
    const warn = p.missing_count ? `<div class="warn">${p.missing_count} not found on the NAS</div>` : '';
    let html = `<tr class="row ${cls}" data-name="${esc(p.name)}"><td><input type="checkbox" ${selected.has(p.name) ? 'checked' : ''}></td>` +
      `<td>${esc(p.name)}</td><td class="num">${p.songs}</td><td>${esc(p.state || '–')}</td><td class="hide-sm">${esc(p.detail)}${more}${warn}</td></tr>`;
    if (hasMore && open.has(p.name)) {
      const list = (t, items) => items.length ? `<b>${t}</b>${items.map(esc).join('<br>')}` : '';
      html += `<tr class="details"><td colspan="5">` + (p.state === 'differs' ? list('Will be added to the drive', p.to_add) +
        list('Only on the drive (removed from the playlist)', p.only_drive) : '') + list('Not found on the NAS', p.missing) + `</td></tr>`;
    }
    return html;
  });
  if (filter === 'all' && !search) rows.push(...data.only_on_drive.map(p =>
    `<tr class="only"><td></td><td>${esc(p.name)}</td><td class="num">${p.songs}</td><td>only on drive</td><td class="hide-sm">not on the NAS</td></tr>`));
  return `<div class="pane">
    <div class="pane-head">
      <input type="search" id="search" placeholder="Search playlists" value="${esc(search)}">
      ${chip('all', 'All')}${chip('differs', 'Differs')}${chip('missing', 'Not on drive')}${chip('nas', 'Missing songs')}
      <button id="selall">Select all</button><button id="selnone">None</button>
    </div>
    <div class="scroll"><table>
      <thead><tr><th style="width:34px"></th><th>PLAYLIST</th><th class="num">SONGS</th><th>ON DRIVE</th><th class="hide-sm">DIFFERENCES</th></tr></thead>
      <tbody>${rows.join('') || `<tr><td colspan="5" class="empty">No playlists ${search || filter !== 'all' ? 'match' : 'found in ' + esc(data.source)}</td></tr>`}</tbody>
    </table></div>
    <div class="pane-foot">
      <div class="for"><span class="section">Layout</span>
        <label class="opt"><input type="radio" name="layout" value="mixxx"> Mixxx (Pi): Music/ + playlist files</label>
        <label class="opt"><input type="radio" name="layout" value="traktor"> Traktor: a folder per playlist</label>
        <span id="laynote" class="miss" style="font-size:12px"></span>
      </div>
      <label class="opt"><input type="checkbox" id="remove"> Remove playlists on the drive that aren't ticked</label>
      <label class="opt"><input type="checkbox" id="prune"> Delete songs no playlist uses</label>
    </div>
  </div>`;
}

function viewDrive() {
  const d = data.drive, formattable = ['mounted', 'ejected', 'error'].includes(d.state) && d.device;
  const kv = mounted() ? `<div class="kv"><span>Format</span><span>${esc(d.fstype)}</span><span>Free</span><span>${gb(d.free)} of ${gb(d.total)}</span>` +
    `<span>Device</span><span class="path">${esc(d.device)}</span><span>Layout</span><span>${d.layout ? LAYOUT_NAMES[d.layout] : 'empty'}</span></div><div class="meter"><div style="width:${Math.round(100 * (d.total - d.free) / d.total)}%"></div></div>`
    : `<p class="muted">${d.state === 'ejected' ? 'You can unplug it now.' : 'Plug a drive into the server\'s front USB port.'}</p>`;
  return `<div class="boxes">
    <div class="box"><div class="section">USB drive</div><div class="big-line ${mounted() ? 'ok' : ''}">${esc(driveName(d))}</div>${kv}
      <div style="margin-top:14px"><button id="eject" ${mounted() && !data.job.running ? '' : 'disabled'}>Eject</button></div></div>
    <div class="box"><div class="section">Format drive</div>
      <p class="muted">Erases everything on the drive and makes one partition.</p>
      <select id="fstype"><option value="vfat">FAT32 (works everywhere, files up to 4 GB)</option><option value="exfat">exFAT (big files, newer players)</option></select>
      <input type="text" id="newlabel" placeholder="New name (e.g. MUSIC)" maxlength="15">
      <button id="format" class="danger" ${formattable && !data.job.running ? '' : 'disabled'}>Format&hellip;</button></div>
  </div>`;
}

function viewSystem() {
  const j = data.job;
  return `<div class="boxes">
    <div class="box"><div class="section">Sources</div><div class="kv">
      <span>Playlists</span><span class="path">${esc(data.source)}</span>
      <span>Songs</span><span class="path">${esc(data.songs_root)}</span>
      <span>Drive</span><span class="path">${esc(data.usb_root)}</span>
      <span>Version</span><span>${esc(data.version)}</span></div></div>
    <div class="box"><div class="section">Last export</div>
      <div class="big-line">${data.last_export ? ago(data.last_export.at) : 'Never'}</div>
      <p class="muted">${data.last_export ? esc(data.last_export.summary) : 'Since the app started.'}</p></div>
  </div>
  <div class="section" style="margin:18px 0 6px">Export log</div><pre id="log">${esc(j.log.join('\n')) || 'Nothing exported yet.'}</pre>`;
}

function route() { return (location.hash || '#playlists').slice(1); }

function render() {
  if (!data) return;
  if (mounted() && !wasMounted) { preselected = false; chosenLayout = null; }   // a new drive
  wasMounted = mounted();
  if (mounted() && !preselected) {
    selected = new Set(data.playlists.filter(p => p.state && p.state !== 'not on drive').map(p => p.name));
    preselected = true;
  }
  const names = new Set(data.playlists.map(p => p.name));
  selected = new Set([...selected].filter(n => names.has(n)));
  const r = route();
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + r));
  const keep = {remove: $('remove') && $('remove').checked, prune: $('prune') && $('prune').checked,
                fstype: $('fstype') && $('fstype').value, newlabel: $('newlabel') && $('newlabel').value,
                focus: document.activeElement && document.activeElement.id};
  $('view').innerHTML = r === 'drive' ? viewDrive() : r === 'system' ? viewSystem() : viewPlaylists();
  if ($('remove')) { $('remove').checked = keep.remove; $('prune').checked = keep.prune; }
  if ($('fstype') && keep.fstype) { $('fstype').value = keep.fstype; $('newlabel').value = keep.newlabel || ''; }
  if (keep.focus && $(keep.focus)) { const el = $(keep.focus); el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); }
  bind();
  renderChrome();
  if ($('log')) $('log').scrollTop = $('log').scrollHeight;
}

function bind() {
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
  document.querySelectorAll('[data-more]').forEach(el => el.onclick = e => {
    e.stopPropagation(); const n = el.dataset.more; open.has(n) ? open.delete(n) : open.add(n); render();
  });
  document.querySelectorAll('tr.row').forEach(tr => tr.onclick = e => {
    const n = tr.dataset.name;
    selected.has(n) ? selected.delete(n) : selected.add(n);
    if (e.target.type !== 'checkbox') tr.querySelector('input').checked = selected.has(n);
    selectionChanged();
  });
  if ($('search')) $('search').oninput = e => { search = e.target.value; render(); };
  if ($('selall')) $('selall').onclick = () => { data.playlists.forEach(p => selected.add(p.name)); selectionChanged(); render(); };
  if ($('selnone')) $('selnone').onclick = () => { selected.clear(); selectionChanged(); render(); };
  document.querySelectorAll('input[name=layout]').forEach(r => r.onchange = () => {
    chosenLayout = r.value; showLayout(); selectionChanged();
  });
  showLayout();
  if ($('eject')) $('eject').onclick = eject;
  if ($('format')) $('format').onclick = format;
}

function selectionChanged() {
  estimate = null;
  renderChrome();
  clearTimeout(estTimer);
  estTimer = setTimeout(async () => {
    if (!mounted() || !selected.size) { estimate = null; return renderChrome(); }
    try { estimate = (await api('/api/estimate', {names: [...selected], layout: layoutNow()})).bytes; } catch (e) { estimate = null; }
    renderChrome();
  }, 300);
}

// ----------------------------------------------------------- actions ----
$('export').onclick = async () => {
  const remove = $('remove') && $('remove').checked, prune = $('prune') && $('prune').checked;
  const del = [remove && 'playlists that are not ticked', prune && 'songs no playlist uses'].filter(Boolean);
  if (del.length && !await dlg('Delete on the drive?', 'This will delete ' + del.join(' and ') + ' on the USB drive.', {ok: 'Export and delete', danger: true})) return;
  const cur = data.drive.layout;
  if (cur && cur !== layoutNow() && !await dlg(`Rearrange ${data.drive.label || 'the drive'}?`,
      `From the ${LAYOUT_NAMES[cur]} to the ${LAYOUT_NAMES[layoutNow()]} layout.\n\nFiles already on the drive are moved, not downloaded again. ` +
      (layoutNow() === 'mixxx' ? 'Extra copies of songs that were in several folders are removed.' : 'Songs no ticked playlist uses go to the Unsorted folder.'),
      {ok: 'Rearrange and export'})) return;
  try {
    notice = null;
    $('export').disabled = true; $('export').textContent = 'Starting…';
    await api('/api/export', {names: [...selected], remove_others: remove, prune, layout: layoutNow()});
    data.job = Object.assign(data.job, {running: true, done: 0, total: 0, error: '', log: []});
    renderChrome();
    watchJob();
  }
  catch (e) { tell('Export failed', e.message); refresh(); }
};

async function eject() {
  $('eject').disabled = true; $('eject').textContent = 'Ejecting…';
  try { await api('/api/eject', {}); } catch (e) { tell('Eject failed', e.message); }
  refresh();
}

async function format() {
  const d = data.drive, label = d.label || 'FORMAT', fs = $('fstype').value, name = $('newlabel').value.trim() || 'MUSIC';
  const typed = await dlg(`Erase ${label}?`, `This ERASES everything on "${label}" and formats it as ${fs === 'vfat' ? 'FAT32' : 'exFAT'} named "${name}".\n\nType the drive's current name to confirm: ${label}`,
                          {ok: 'Format', danger: true, input: label});
  if (typed === null) return;
  $('format').disabled = true; $('format').textContent = 'Formatting…';
  try { const r = await api('/api/format', {fstype: fs, label: name, confirm: typed.trim()}); tell('Formatted', `"${r.label}" (${r.fstype}) is ready.`); preselected = false; }
  catch (e) { tell('Format failed', e.message); }
  refresh();
}

async function refresh() {
  try { data = await api('/api/state'); render(); }
  catch (e) { $('view').innerHTML = `<p class="err">Server not reachable: ${esc(e.message)}</p>`; }
}

async function watchJob() {
  if (polling) return;
  polling = true;
  try {
    for (;;) {
      const j = await api('/api/job');
      data.job = j;
      renderChrome();
      if ($('log')) { $('log').textContent = j.log.join('\n'); $('log').scrollTop = $('log').scrollHeight; }
      if (!j.running) break;
      await new Promise(r => setTimeout(r, 500));
    }
  } finally { polling = false; }
  const j = data.job;
  if (!j.error && j.summary) {
    notice = /0 copied from the NAS, 0 moved, 0 duplicated/.test(j.summary) && !/deleted|Unsorted|removed/.test(j.summary)
      ? 'Already up to date: everything ticked is on the drive.' : 'Done: ' + j.summary;
    setTimeout(() => { notice = null; renderChrome(); }, 15000);
  }
  refresh();
}

window.addEventListener('hashchange', render);
refresh().then(() => { if (data && data.job.running) watchJob(); selectionChanged(); });
setInterval(() => {
  const typing = document.activeElement && ['search', 'newlabel', 'trkletter'].includes(document.activeElement.id);
  if (!polling && !typing && !(data && data.job.running)) refresh();
}, 4000);
</script>
</body>
</html>
